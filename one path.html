
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The One</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;

}

.page {
  width: 100vw;
  height: 100vh;
  position: absolute;
  top: 0;
  left: 0;
  background: black;
  display: none;
  overflow: hidden;
}

.page.active {
  display: block;
}

.dot {
  width: 30px;
  height: 30px;
  background: red;
  border-radius: 50%;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
}

.ring {
  position: absolute;
  border: 1px solid white;
  border-radius: 50%;
  box-sizing: border-box;
}

.red-ring {
  border-color: red;
}

.petal {
  position: absolute;
  width: 20px;
  height: 40px;
  border: 1px solid white;
  border-radius: 50%;
  left: 50%;
  top: 50%;
  transform-origin: center 21px;
}

.eye {
  position: absolute;
  width: 72px;
  height: 30px;
  border: 1px solid red;
  border-radius: 50%;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
}

.eye:after {
  content: "";
  position: absolute;
  width: 16px;
  height: 24px;
  border: 1px solid red;
  border-radius: 50%;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
}

.flower {
  position: absolute;
  width: 100px;
  height: 100px;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
}

.bubble {
  position: absolute;
  border: 1px solid white;
  border-radius: 50%;
  box-sizing: border-box;
}

#choice .ring {
  cursor: pointer;
}

#choice .ring:nth-child(1) {
  width: 105px;
  height: 105px;
  left: 15%;
  top: 50%;
  transform: translateY(-50%);
}

#choice .ring:nth-child(2) {
  width: 48px;
  height: 48px;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
}

#choice .ring:nth-child(3) {
  width: 25px;
  height: 25px;
  left: 80%;
  top: 50%;
  transform: translateY(-50%);
}
</style>
</head>

<body>

<div class="page active" id="start">
  <div class="dot"></div>
</div>

<div class="page" id="choice">
  <div class="ring" onclick="openRoute('waves')"></div>
  <div class="ring" onclick="openRoute('petal')"></div>
  <div class="ring" onclick="openRoute('other')"></div>
</div>


<div class="page route" id="waves">
  <div class="ring wave" style="width:180px;height:180px;left:50%;top:50%;transform:translate(-50%,-50%)"></div>
  <div class="ring wave" style="width:140px;height:140px;left:50%;top:50%;transform:translate(-50%,-50%)"></div>
  <div class="ring wave" style="width:100px;height:100px;left:50%;top:50%;transform:translate(-50%,-50%)"></div>
  <div class="ring wave" style="width:60px;height:60px;left:50%;top:50%;transform:translate(-50%,-50%)"></div>
</div>


<div class="page route" id="petal">
  <div class="flower" data-petals="6">

  </div>
</div>

<div class="page route" id="eye">
  <div class="eye">

  </div>
  <div class="ring" style="width:120px;height:120px;left:20%;top:30%"></div>
  <div class="ring" style="width:45px;height:45px;left:75%;top:65%"></div>
</div>

<div class="page route" id="petal2">
  <div class="flower" data-petals="3" data-red="yes"></div>
  <div class="ring red-ring" style="width:5px;height:5px;left:20%;top:70%"></div>
  <div class="ring red-ring" style="width:5px;height:5px;left:80%;top:50%"></div>
</div>


<div class="page route" id="other">
  <div class="bubble" style="left:15%;top:80%;width:30px;height:30px"></div>
  <div class="bubble" style="left:30%;top:90%;width:18px;height:18px"></div>
  <div class="bubble" style="left:45%;top:75%;width:40px;height:40px"></div>
  <div class="bubble" style="left:60%;top:88%;width:24px;height:24px"></div>
  <div class="bubble" style="left:75%;top:82%;width:34px;height:34px"></div>
  <div class="bubble" style="left:85%;top:95%;width:15px;height:15px"></div>
  <div class="bubble" style="left:25%;top:65%;width:12px;height:12px"></div>
  <div class="bubble" style="left:68%;top:60%;width:20px;height:20px"></div>
</div>

<script>
const pages = document.querySelectorAll(".page");
let currentPage = document.getElementById("start");
let routeName = "";
let waveCount = 0;
let routeStep = 0;

function showPage(id) {
  pages.forEach(page => page.classList.remove("active"));
  currentPage = document.getElementById(id);
  currentPage.classList.add("active");
}

function makeFlower(flower) {
  const number = Number(flower.dataset.petals);
  const color = flower.dataset.red ? "red" : "white";

  for (let i = 0; i < number; i++) {
    const petal = document.createElement("div");
    petal.className = "petal";
    petal.style.borderColor = color;
    petal.style.transform =
      "translate(-50%,-50%) rotate(" + (i * 360 / number) + "deg)";
    flower.appendChild(petal);
  }

  const center = document.createElement("div");
  center.className = "ring";
  center.style.width = "12px";
  center.style.height = "12px";
  center.style.left = "44px";
  center.style.top = "44px";
  center.style.borderColor = color;
  flower.appendChild(center);
}

document.querySelectorAll(".flower").forEach(makeFlower);

function openRoute(name) {
  routeName = name;
  routeStep = 0;
  waveCount = 0;

  if (name === "waves") {
    showPage("waves");
  } else if (name === "petal") {
    showPage("petal");
  } else {
    showPage("other");
  }
}

function changeWaves() {
  const rings = document.querySelectorAll("#waves .wave");

  waveCount++;

  if (waveCount === 1) {
    rings.forEach((ring, i) => {
      ring.style.left = (35 + i * 10) + "%";
      ring.style.top = (35 + i * 10) + "%";
      ring.style.transform = "translate(-50%,-50%)";
    });
  } else if (waveCount === 2) {
    rings.forEach((ring, i) => {
      ring.style.left = (65 - i * 10) + "%";
      ring.style.top = (60 - i * 7) + "%";
      ring.style.transform = "translate(-50%,-50%)";
    });
  } else {
    showPage("choice");
  }
}

function nextRoutePage() {
  if (routeName === "waves") {
    changeWaves();
  } else if (routeName === "petal") {
    routeStep++;

    if (routeStep === 1) {
      showPage("eye");
    } else if (routeStep === 2) {
      showPage("petal2");
    } else {
      showPage("choice");
    }
  } else if (routeName === "other") {
    routeStep++;

    if (routeStep === 1) {
      showPage("other2");
    } else {
      showPage("choice");
    }
  }
}

document.getElementById("start").addEventListener("click", () => {
  showPage("choice");
});

document.querySelectorAll(".route").forEach(page => {
  page.addEventListener("click", nextRoutePage);
});
</script>

</body>
</html>
